<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Webpage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar">
    <h1>HELLO WORLD</h1>
    <p>This is a fixed navbar</p>
    
  </nav>
  <div class="container">
    <div class="left-menu">
      <button id="toggleMenu">Toggle Menu</button>
      <ul id="MenuList">
        <h2>LEFT SIDE MENU</h2>
        <li>List 1</li>
        <li>List 2</li>
        <li>List 3</li>
      </ul>
    </div>
    <main class="main-content">
      <h2>Main Content Area</h2>
      <p>This is the main section of the page.</p>
    </main>
    <aside class="right-panel">
      <h2>Right Panel</h2>
      <p>Information area.</p>
    </aside>
  </div>
  <footer class="footer">
    <p>Footer section of the page</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
